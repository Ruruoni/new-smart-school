# The developer Control Tower (cloud control plane). Run it on ONE server you control, behind HTTPS.
#   docker compose -f deploy/docker-compose.cloud.yml --env-file deploy/cloud.env up -d
# NOTE: written but NOT run in the authoring environment (no Docker daemon there). See docs/deployment.md.
name: smartschool-cloud

x-cloud: &cloud
  image: smartschool/cloud:2.0.0
  build: { context: .., dockerfile: deploy/Dockerfile, args: { APP: cloud } }
  restart: unless-stopped
  environment: &env
    CLOUD_DATABASE_URL: postgresql://smartschool:${POSTGRES_PASSWORD}@db:5432/smartschool_cloud
    CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY}
    CLOUD_SIGNING_PRIVATE_KEY: ${CLOUD_SIGNING_PRIVATE_KEY}
    CLOUD_SIGNING_PUBLIC_KEY: ${CLOUD_SIGNING_PUBLIC_KEY}
    BACKUP_STORAGE_DIR: /data/backups
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
    # auto: Secure cookie when the request arrived over HTTPS (behind Caddy/nginx/Traefik) — works on plain HTTP too. Force with true/false.
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
  volumes: [cloud-data:/data]

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment: { POSTGRES_USER: smartschool, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: smartschool_cloud }
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U smartschool -d smartschool_cloud"], interval: 5s, timeout: 3s, retries: 20 }

  migrate:
    <<: *cloud
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on: { db: { condition: service_healthy } }

  web:
    <<: *cloud
    ports: ["${WEB_PORT:-3100}:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 5, start_period: 30s }

volumes:
  pgdata:
  cloud-data:
