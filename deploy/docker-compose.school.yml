# One school's own server: PostgreSQL + web app + background worker, all on the school's LAN.
# Nothing here needs the internet. Copy deploy/school.env.example to deploy/school.env and fill it in first.
#   docker compose -f deploy/docker-compose.school.yml --env-file deploy/school.env up -d
# NOTE: written but NOT run in the authoring environment (no Docker daemon there). See docs/deployment.md "What was verified".
name: smartschool-school

x-school: &school
  image: smartschool/school:2.0.0
  build: { context: .., dockerfile: deploy/Dockerfile, args: { APP: school } }
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgresql://smartschool:${POSTGRES_PASSWORD}@db:5432/smartschool_school
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    APP_SIGNING_SECRET: ${APP_SIGNING_SECRET}
    STORAGE_DIR: /data/storage
    BACKUP_DIR: /data/backups
    CLOUD_URL: ${CLOUD_URL:-}
    CLOUD_PUBLIC_KEY: ${CLOUD_PUBLIC_KEY:-}
    # Terminate TLS at a reverse proxy (Caddy/nginx) if the school uses HTTPS; on plain LAN HTTP set this to false.
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
    TZ: Africa/Lagos
  volumes: [school-data:/data]

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment: { POSTGRES_USER: smartschool, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: smartschool_school, TZ: Africa/Lagos }
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U smartschool -d smartschool_school"], interval: 5s, timeout: 3s, retries: 20 }

  migrate:
    <<: *school
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on: { db: { condition: service_healthy } }

  web:
    <<: *school
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 5, start_period: 30s }

  worker:
    <<: *school
    command: ["node_modules/.bin/tsx", "src/workers/main.ts"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment: { <<: *env, WORKER_NAME: worker-1 }
    # Healthy only while the worker keeps beating: a running-but-wedged worker is reported, not assumed fine.
    healthcheck: { test: ["CMD", "node_modules/.bin/tsx", "scripts/worker-health.ts"], interval: 30s, timeout: 20s, retries: 3, start_period: 60s }

volumes:
  pgdata:
  school-data:
